<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pelanggan Laundry</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <header class="form-header">
            <h2>Modul Data Pelanggan</h2>
            <p>Silakan isi biodata, nomor telepon, dan catatan penanganan khusus untuk pakaian Anda.</p>
        </header>

        <form action="#" method="POST" class="laundry-form">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label for="telepon">Nomor Telpon / WhatsApp</label>
                <input type="tel" id="telepon" name="telepon" placeholder="Contoh: 081234567890" required>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Pelanggan</label>
                <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap penjemputan/pengiriman"></textarea>
            </div>

            <div class="form-group">
                <label for="catatan">Catatan Penanganan Khusus Pakaian</label>
                <textarea id="catatan" name="catatan" rows="4" placeholder="Contoh: Baju putih jangan dicampur, gaun sutra harap dry clean saja, luntur di celana jeans, dll."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Simpan Data Pelanggan</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
